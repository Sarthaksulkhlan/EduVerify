<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title">
<title id="title">EduVerify local architecture with fixture and persistent backend modes</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ba914b"/></marker></defs>
<rect width="1200" height="610" rx="22" fill="#f5f2e9"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="55" font-size="29" fill="#182f2b" font-weight="700">One interface. Two API modes. Distinct trust boundaries.</text><text x="40" y="87" font-size="17" fill="#5b6d65" font-weight="400">Local runtime shown; Vercel configuration routes /api requests directly to FastAPI.</text><rect x="40" y="125" width="330" height="147" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="58" y="145" width="5" height="24" rx="2" fill="#155b4b"/><text x="74" y="164" font-size="21" fill="#182f2b" font-weight="700">React frontend</text><text x="60" y="198" font-size="16" fill="#5b6d65" font-weight="400">Student + administration portals</text><text x="60" y="223" font-size="16" fill="#5b6d65" font-weight="400">Same-origin /api/v1 client</text><text x="60" y="248" font-size="16" fill="#5b6d65" font-weight="400">Some state remains browser-local</text><rect x="435" y="125" width="330" height="147" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="453" y="145" width="5" height="24" rx="2" fill="#155b4b"/><text x="469" y="164" font-size="21" fill="#182f2b" font-weight="700">Express host / proxy</text><text x="455" y="198" font-size="16" fill="#5b6d65" font-weight="400">Vite in development</text><text x="455" y="223" font-size="16" fill="#5b6d65" font-weight="400">Fixture mode or upstream proxy</text><text x="455" y="248" font-size="16" fill="#5b6d65" font-weight="400">Live failures do not fall back</text><path d="M375 197 L422 197" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="830" y="125" width="330" height="147" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="848" y="145" width="5" height="24" rx="2" fill="#ba914b"/><text x="864" y="164" font-size="21" fill="#182f2b" font-weight="700">Fixture API</text><text x="850" y="198" font-size="16" fill="#5b6d65" font-weight="400">Synthetic in-memory state</text><text x="850" y="223" font-size="16" fill="#5b6d65" font-weight="400">Simulated sessions/signatures</text><text x="850" y="248" font-size="16" fill="#5b6d65" font-weight="400">Resets when server restarts</text><path d="M771 197 L817 197" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="785" y="180" font-size="14" fill="#5b6d65" font-weight="400">mock</text><rect x="435" y="350" width="330" height="172" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="453" y="370" width="5" height="24" rx="2" fill="#155b4b"/><text x="469" y="389" font-size="21" fill="#182f2b" font-weight="700">FastAPI services</text><text x="455" y="423" font-size="16" fill="#5b6d65" font-weight="400">Auth + tenant policies</text><text x="455" y="448" font-size="16" fill="#5b6d65" font-weight="400">Ingestion + duplicate review</text><text x="455" y="473" font-size="16" fill="#5b6d65" font-weight="400">Consent + Ed25519 checks</text><text x="455" y="498" font-size="16" fill="#5b6d65" font-weight="400">Hash-linked audit writes</text><path d="M600 278 L600 338" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="615" y="316" font-size="15" fill="#5b6d65" font-weight="400">live</text><rect x="830" y="350" width="330" height="172" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="848" y="370" width="5" height="24" rx="2" fill="#155b4b"/><text x="864" y="389" font-size="21" fill="#182f2b" font-weight="700">PostgreSQL 16</text><text x="850" y="423" font-size="16" fill="#5b6d65" font-weight="400">Durable domain records</text><text x="850" y="448" font-size="16" fill="#5b6d65" font-weight="400">Sessions, consent, credentials</text><text x="850" y="473" font-size="16" fill="#5b6d65" font-weight="400">Five migration revisions</text><text x="850" y="498" font-size="16" fill="#5b6d65" font-weight="400">Separate worker still planned</text><path d="M771 430 L817 430" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="575" font-size="16" fill="#5b6d65" font-weight="400">Backend capabilities do not imply all portal screens are wired to them. No government integration is implemented.</text></g></svg>