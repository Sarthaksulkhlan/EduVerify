<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-labelledby="title">
<title id="title">EduVerify ingestion, validation, capacity, review and consent-scoped record-check workflow</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ba914b"/></marker></defs>
<rect width="1200" height="515" rx="22" fill="#f5f2e9"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#182f2b" font-weight="700">From submitted records to scoped evidence</text><text x="40" y="87" font-size="17" fill="#5b6d65" font-weight="400">Implemented service capabilities · portal integration is incomplete</text><rect x="40" y="125" width="235" height="133" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="58" y="145" width="5" height="24" rx="2" fill="#155b4b"/><text x="74" y="164" font-size="21" fill="#182f2b" font-weight="700">01  Import</text><text x="60" y="198" font-size="16" fill="#5b6d65" font-weight="400">Synthetic CSV</text><text x="60" y="223" font-size="16" fill="#5b6d65" font-weight="400">Institution context</text><path d="M280 191 L320 191" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335" y="125" width="235" height="133" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="353" y="145" width="5" height="24" rx="2" fill="#155b4b"/><text x="369" y="164" font-size="21" fill="#182f2b" font-weight="700">02  Validate</text><text x="355" y="198" font-size="16" fill="#5b6d65" font-weight="400">Explain row findings</text><text x="355" y="223" font-size="16" fill="#5b6d65" font-weight="400">Protect identifiers</text><path d="M575 191 L615 191" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="630" y="125" width="235" height="133" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="648" y="145" width="5" height="24" rx="2" fill="#155b4b"/><text x="664" y="164" font-size="21" fill="#182f2b" font-weight="700">03  Commit</text><text x="650" y="198" font-size="16" fill="#5b6d65" font-weight="400">Recheck intake</text><text x="650" y="223" font-size="16" fill="#5b6d65" font-weight="400">Persist eligible rows</text><path d="M870 191 L910 191" stroke="#ba914b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="925" y="125" width="235" height="133" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="943" y="145" width="5" height="24" rx="2" fill="#155b4b"/><text x="959" y="164" font-size="21" fill="#182f2b" font-weight="700">04  Investigate</text><text x="945" y="198" font-size="16" fill="#5b6d65" font-weight="400">Masked candidates</text><text x="945" y="223" font-size="16" fill="#5b6d65" font-weight="400">Human decisions</text><rect x="40" y="310" width="530" height="134" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="58" y="330" width="5" height="24" rx="2" fill="#155b4b"/><text x="74" y="349" font-size="21" fill="#182f2b" font-weight="700">05  Authorize and verify</text><text x="60" y="383" font-size="16" fill="#5b6d65" font-weight="400">Verifier grant + student consent + permitted claims</text><text x="60" y="408" font-size="16" fill="#5b6d65" font-weight="400">Five-minute, audience-bound Ed25519 record check</text><rect x="610" y="310" width="550" height="134" rx="16" fill="#fffdf8" stroke="#d6dfd8"/><rect x="628" y="330" width="5" height="24" rx="2" fill="#ba914b"/><text x="644" y="349" font-size="21" fill="#182f2b" font-weight="700">Evidence boundaries</text><text x="630" y="383" font-size="16" fill="#5b6d65" font-weight="400">A duplicate candidate is not a fraud verdict.</text><text x="630" y="408" font-size="16" fill="#5b6d65" font-weight="400">A signed record check is not official identity verification.</text><text x="40" y="484" font-size="16" fill="#5b6d65" font-weight="400">Review and issuance are separate services; no universal review-to-issuance gate is asserted.</text></g></svg>